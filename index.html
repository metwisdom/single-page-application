<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Look up a word to see its pronunciation, definitions, and synonyms."
    />
    <title>My Dictionary</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <header>
      <h1>My Dictionary</h1>
      <p>Look up a word to see its pronunciation, definitions, and synonyms.</p>
    </header>

    <main>
      <section aria-labelledby="search-heading">
        <h2 id="search-heading">Search</h2>
        <form id="search-form" aria-describedby="search-hint">
          <label for="word-input">Word</label>

          <input
            id="word-input"
            name="word"
            type="text"
            placeholder="e.g. hello"
            autocomplete="off"
            spellcheck="false"
            required
          />

          <p id="search-hint">
            Press Enter or click Search to look up the word.
          </p>

          <button type="submit" aria-label="Search for the typed word">
            Search
          </button>
        </form>
      </section>

      <p id="status" role="status" aria-live="polite" aria-atomic="true"></p>
      <section aria-labelledby="results-heading">
        <h2 id="results-heading">Results</h2>

        <div id="result">
        </div>
      </section>
    </main>

    <footer>
      <p>Definitions powered by the Free Dictionary API.</p>
    </footer>
    <script src="index.js"></script>
  </body>
</html>
